name: Build TrojanGram

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Gradle task to run'
        required: true
        default: ':TMessagesProj_AppStandalone:assembleAfatDebug'
        type: choice
        options:
          - ':TMessagesProj_AppStandalone:assembleAfatDebug'
          - ':TMessagesProj_AppStandalone:assembleAfatStandalone'
          - ':TMessagesProj_App:assembleAfatRelease'
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No third-party Android action - they break on new runner images.
      # The GitHub image already ships the Android SDK; we only add what's missing.
      - name: Android SDK, NDK, CMake
        run: |
          set -e
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT}}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          CM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin 2>/dev/null | head -1)
          if [ -z "$CM" ]; then
            echo "no cmdline-tools, installing"
            cd /tmp
            curl -fL -o cmd.zip https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
            unzip -q cmd.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            CM="$ANDROID_HOME/cmdline-tools/latest/bin"
          fi
          echo "sdkmanager at $CM"
          export PATH="$PATH:$CM"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"
          sdkmanager --list_installed
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      # APP_ID / APP_HASH come from Secrets, never from the repo.
      - name: Inject API credentials
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          f=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -n "$APP_ID" ]; then
            sed -i "s/public static int APP_ID = .*/public static int APP_ID = $APP_ID;/" "$f"
          fi
          if [ -n "$APP_HASH" ]; then
            sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"$APP_HASH\";/" "$f"
          fi
          sed -n '29,30p' "$f"

      # Firebase is optional. Without the secret, generate non-secret placeholders
      # so the Google Services plugin can configure the build without push support.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 -d > /tmp/gs.json
            for module in TMessagesProj TMessagesProj_App TMessagesProj_AppStandalone TMessagesProj_AppHuawei; do
              cp /tmp/gs.json "$module/google-services.json"
            done
            echo "firebase config restored"
          else
            for module in TMessagesProj TMessagesProj_App TMessagesProj_AppStandalone TMessagesProj_AppHuawei; do
              cat > "$module/google-services.json" <<'JSON'
          {
            "project_info": {
              "project_number": "0",
              "project_id": "trojangram-ci",
              "storage_bucket": "trojangram-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "org.trojangram.messenger"
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000001",
                  "android_client_info": {
                    "package_name": "org.trojangram.messenger.beta"
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:0:android:0000000000000002",
                  "android_client_info": {
                    "package_name": "org.trojangram.messenger.web"
                  }
                }
              }
            ]
          }
          JSON
            done
            echo "no firebase secret - generated non-secret placeholder config"
          fi

      # Optional: your own keystore. Without it the repo's dummy keystore is used.
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
            {
              echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> gradle.properties
            echo "using keystore from secrets"
          else
            echo "no keystore secret - using dummy keystore"
          fi

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew ${{ inputs.task || ':TMessagesProj_AppStandalone:assembleAfatDebug' }} --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trojangram-apk
          path: |
            TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
            TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: warn
